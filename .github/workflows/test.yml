name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: tests/cses
          key: cses-tests-${{ hashFiles('test.py') }}
          restore-keys: cses-tests-
      - run: python test.py --verbose
